<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Barkod Terminal</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#111;color:#eee;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;gap:6px;padding:6px;align-items:center;background:#1c1c1e}
header .t{flex:1;font-size:13px;opacity:.8;line-height:1.2}
button{font:inherit;border:0;border-radius:10px;background:#2c2c2e;color:#fff;padding:10px 12px}
button:active{filter:brightness(1.4)}
#cam{position:relative;height:30vh;min-height:170px;background:#000;border:5px solid #333;transition:border-color .1s}
#cam video{width:100%;height:100%;object-fit:cover}
#cam .line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:rgba(255,60,60,.8);box-shadow:0 0 8px red}
#cam.ok{border-color:#16a34a}#cam.bad{border-color:#dc2626}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a}
#start button{background:#16a34a;font-size:20px;padding:16px 24px}
#stat{padding:10px 12px;font-weight:700;font-size:18px;background:#333;transition:background .1s;min-height:48px;display:flex;align-items:center}
#stat.ok{background:#16a34a}#stat.bad{background:#dc2626}
#list{flex:1;overflow:auto;padding:6px}
.row{display:flex;align-items:center;gap:8px;background:#1c1c1e;border-radius:12px;padding:8px 10px;margin-bottom:6px}
.row.new{outline:2px solid #16a34a}
.row .i{flex:1;min-width:0}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{display:flex;align-items:center;gap:4px}
.q button{width:42px;height:42px;font-size:22px;padding:0}
.q input{width:52px;height:42px;text-align:center;font-size:18px;border-radius:8px;border:0;background:#000;color:#fff}
.empty{text-align:center;opacity:.5;margin-top:30px}
footer{display:flex;gap:8px;align-items:center;padding:8px;background:#1c1c1e}
footer .tot{flex:1;font-size:14px;line-height:1.3}
footer .tot b{font-size:18px}
#close{background:#dc2626;font-weight:700;font-size:17px;padding:14px 18px}
dialog{border:0;border-radius:16px;background:#222;color:#eee;width:92%;max-width:420px;padding:16px}
dialog::backdrop{background:#000a}
dialog label{display:block;margin:10px 0 4px;font-size:14px;opacity:.8}
dialog input[type=text],dialog input[type=email],dialog input[type=tel]{width:100%;padding:12px;font-size:16px;border-radius:8px;border:0;background:#000;color:#fff}
dialog .b{display:flex;flex-direction:column;gap:8px;margin-top:14px}
dialog .b button{padding:14px}
.g{background:#16a34a!important}.w{background:#25d366!important;color:#000}.bl{background:#2563eb!important}
</style>
</head>
<body>
<header>
  <div class="t" id="info">Excel yüklenmedi</div>
  <button id="bTorch" hidden>🔦</button>
  <button id="bXls">📂 Excel</button>
  <button id="bSet">⚙️</button>
</header>
<div id="cam"><video id="v" playsinline muted autoplay></video><div class="line"></div>
  <div id="start"><button id="bStart">▶ KAMERAYI BAŞLAT</button></div></div>
<div id="stat">Hazır</div>
<div id="list"></div>
<footer>
  <div class="tot"><div id="tq">0 adet</div><b id="tt"></b></div>
  <button id="bClr">🗑</button>
  <button id="close">HESAP KAPAT</button>
</footer>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>

<dialog id="dSet">
  <b>Ayarlar</b>
  <label>E-posta adresi (hesap buraya gönderilir)</label>
  <input type="email" id="email" placeholder="ornek@mail.com">
  <label>WhatsApp numarası (ülke kodlu, örn. 905551112233)</label>
  <input type="tel" id="phone" placeholder="905551112233">
  <label><input type="checkbox" id="optDup" checked> Aynı barkod kamerada kaldığı sürece tekrar eklenmesin</label>
  <div class="b"><button class="g" id="sSave">Kaydet</button></div>
</dialog>

<dialog id="dClose">
  <b>Hesap hazır</b>
  <div id="cSum" style="margin:8px 0;font-size:14px;opacity:.85"></div>
  <div class="b">
    <button class="bl" id="gMail">✉️ Mail gönder</button>
    <button class="w" id="gWa">💬 WhatsApp gönder</button>
    <button id="gXls">📎 Excel olarak paylaş / indir</button>
    <button class="g" id="gNew">✔ Bitti – yeni hesap aç</button>
    <button id="gBack">Geri dön</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let catalog=new Map(), cart=new Map(), last={code:'',t:0}, stream=null, running=false, det=null, zx=null, torchOn=false;
const cfg=JSON.parse(localStorage.getItem('bt_cfg')||'{"email":"","phone":"","dup":true}');

/* ---------- Depolama (IndexedDB) ---------- */
const dbp=new Promise(r=>{try{const q=indexedDB.open('bt',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function kvSet(k,v){const d=await dbp;if(d)d.transaction('kv','readwrite').objectStore('kv').put(v,k)}
async function kvGet(k){const d=await dbp;if(!d)return;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}
const saveCart=()=>kvSet('cart',[...cart.entries()]);

/* ---------- Yardımcılar ---------- */
const norm=s=>String(s??'').trim().replace(/\.0+$/,'').replace(/^0+/,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
let ac=null;
function beep(ok){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
 o.type=ok?'sine':'square';o.frequency.value=ok?1500:180;g.gain.value=.25;o.start();o.stop(ac.currentTime+(ok?.09:.35))}catch(e){}}
function feedback(ok,msg){
  const c=$('#cam'),s=$('#stat');
  c.className=s.className=ok?'ok':'bad';
  s.textContent=(ok?'✔ ':'✖ ')+msg;
  beep(ok); if(navigator.vibrate)navigator.vibrate(ok?40:[120,60,120]);
  clearTimeout(feedback.t);feedback.t=setTimeout(()=>{c.className='';},500);
}

/* ---------- Excel yükleme ---------- */
$('#bXls').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('#info').textContent='Yükleniyor…';
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    const head=(rows[0]||[]).map(x=>String(x).toLocaleLowerCase('tr'));
    const find=re=>head.findIndex(h=>re.test(h));
    let ib=find(/barkod|barcode|ean/),inm=find(/ad[ıi]$|a[çc][ıi]klama|[üu]r[üu]n|stok|name|desc/),ip=find(/fiyat|price|tutar/),start=1;
    if(ib<0){ib=0;inm=1;ip=2;start=0}
    const arr=[];
    for(let i=start;i<rows.length;i++){
      const r=rows[i],code=norm(r[ib]);if(!code)continue;
      const extra=[];r.forEach((v,j)=>{if(j!==ib&&j!==inm&&j!==ip&&String(v).trim()!=='')extra.push(String(v))});
      const pr=typeof r[ip]==='number'?r[ip]:parseFloat(String(r[ip]).replace(',','.'));
      arr.push([code,String(r[inm]??''),isNaN(pr)?null:pr,extra.slice(0,3).join(' · '),String(r[ib]).trim()]);
    }
    setCatalog(arr);await kvSet('catalog',arr);
    feedback(true,arr.length+' ürün yüklendi');
  }catch(err){$('#info').textContent='Excel okunamadı';alert('Excel okunamadı: '+err.message)}
  e.target.value='';
};
function setCatalog(arr){
  catalog=new Map(arr.map(a=>[a[0],{name:a[1],price:a[2],extra:a[3],raw:a[4]}]));
  $('#info').textContent=catalog.size.toLocaleString('tr-TR')+' ürün yüklü';
}

/* ---------- Sepet ---------- */
function onCode(raw){
  const now=Date.now(),k=norm(raw);if(!k)return;
  if(cfg.dup&&k===last.code&&now-last.t<1500){last.t=now;return}
  last={code:k,t:now};
  if(!catalog.size){feedback(false,'Önce Excel yükleyin');return}
  const it=catalog.get(k);
  if(!it){feedback(false,'Bulunamadı: '+raw);return}
  const c=cart.get(k);cart.delete(k);
  cart.set(k,{qty:(c?c.qty:0)+1});
  feedback(true,it.name||it.raw);render(k);saveCart();
}
function render(newKey){
  const L=$('#list');let tq=0,tt=0,hasP=false;
  if(!cart.size){L.innerHTML='<div class="empty">Henüz ürün okutulmadı</div>'}
  else{
    L.innerHTML=[...cart.entries()].reverse().map(([k,c])=>{
      const it=catalog.get(k)||{name:k,price:null,extra:'',raw:k};
      tq+=c.qty;if(it.price!=null){tt+=it.price*c.qty;hasP=true}
      return `<div class="row${k===newKey?' new':''}" data-k="${esc(k)}"><div class="i"><div class="n">${esc(it.name||it.raw)}</div>
      <div class="s">${esc(it.raw)}${it.price!=null?' · '+money(it.price)+' ₺':''}${it.extra?' · '+esc(it.extra):''}</div></div>
      <div class="q"><button data-d="-1">−</button><input type="number" inputmode="numeric" value="${c.qty}" data-q><button data-d="1">+</button></div></div>`}).join('');
  }
  $('#tq').textContent=cart.size+' çeşit · '+tq+' adet';
  $('#tt').textContent=hasP?money(tt)+' ₺':'';
}
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('button[data-d]');if(!b)return;
  const k=b.closest('.row').dataset.k,c=cart.get(k);if(!c)return;
  c.qty+=+b.dataset.d;if(c.qty<=0)cart.delete(k);
  render();saveCart();
});
$('#list').addEventListener('change',e=>{
  if(!e.target.matches('[data-q]'))return;
  const k=e.target.closest('.row').dataset.k,v=parseInt(e.target.value);
  if(!v||v<=0)cart.delete(k);else cart.get(k).qty=v;
  render();saveCart();
});
$('#bClr').onclick=()=>{if(cart.size&&confirm('Tüm okutulanlar silinsin mi?')){cart.clear();render();saveCart()}};

/* ---------- Kamera ve okuma ---------- */
$('#bStart').onclick=startCam;
async function startCam(){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  }catch(e){alert('Kamera açılamadı: '+e.message+'\n(Sayfa https üzerinden açılmalı ve kamera izni verilmeli)');return}
  const v=$('#v');v.srcObject=stream;await v.play().catch(()=>{});
  $('#start').hidden=true;
  const tr=stream.getVideoTracks()[0];
  try{const caps=tr.getCapabilities?tr.getCapabilities():{};
    if(caps.focusMode&&caps.focusMode.includes('continuous'))tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
    if(caps.torch)$('#bTorch').hidden=false;}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
  if('BarcodeDetector' in window){
    try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']})}catch(e){det=null}
  }
  if(!det)await loadZX();
  running=true;tick();
}
function loadZX(){return new Promise(res=>{
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  s.onload=()=>{const Z=ZXing,h=new Map(),F=Z.BarcodeFormat;
    h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE]);
    const mr=new Z.MultiFormatReader();mr.setHints(h);
    zx={mr,cv:document.createElement('canvas')};res()};
  s.onerror=()=>{alert('Okuyucu kütüphanesi yüklenemedi (internet gerekli).');res()};
  document.head.appendChild(s)})}
async function tick(){
  if(!running)return;
  const v=$('#v');
  if(v.readyState>=2){
    try{
      if(det){const r=await det.detect(v);if(r.length)onCode(r[0].rawValue)}
      else if(zx){
        const w=640,h=Math.round(w*v.videoHeight/v.videoWidth)||360,cv=zx.cv;cv.width=w;cv.height=h;
        cv.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,w,h);
        try{const bm=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)));
          onCode(zx.mr.decode(bm).getText())}catch(e){}
      }
    }catch(e){}
  }
  setTimeout(tick,det?35:60);
}
$('#bTorch').onclick=()=>{torchOn=!torchOn;stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]}).catch(()=>{})};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stream&&!stream.active)location.reload()});

/* ---------- Ayarlar ---------- */
$('#bSet').onclick=()=>{$('#email').value=cfg.email;$('#phone').value=cfg.phone;$('#optDup').checked=cfg.dup;$('#dSet').showModal()};
$('#sSave').onclick=()=>{cfg.email=$('#email').value.trim();cfg.phone=$('#phone').value.replace(/\D/g,'');cfg.dup=$('#optDup').checked;
  localStorage.setItem('bt_cfg',JSON.stringify(cfg));$('#dSet').close()};

/* ---------- Hesap kapat ---------- */
function items(){return [...cart.entries()].map(([k,c])=>{const it=catalog.get(k)||{name:k,price:null,raw:k};
  return {code:it.raw||k,name:it.name,qty:c.qty,price:it.price,total:it.price!=null?it.price*c.qty:null}})}
function summary(){
  const L=items(),d=new Date().toLocaleString('tr-TR');let tq=0,tt=0,hp=false;
  const lines=L.map((x,i)=>{tq+=x.qty;if(x.total!=null){tt+=x.total;hp=true}
    return `${i+1}) ${x.name||''} [${x.code}] x${x.qty}`+(x.total!=null?` = ${money(x.total)} TL`:'')});
  return {subject:'Hesap - '+d,body:`HESAP - ${d}\n\n${lines.join('\n')}\n\nÇeşit: ${L.length}  Toplam adet: ${tq}`+(hp?`\nToplam tutar: ${money(tt)} TL`:''),tq,tt,hp};
}
$('#close').onclick=()=>{
  if(!cart.size){alert('Okutulmuş ürün yok');return}
  if(!cfg.email&&!cfg.phone){alert('Önce ⚙️ Ayarlar bölümünden mail ve WhatsApp numaranı gir');$('#bSet').click();return}
  const s=summary();
  $('#cSum').textContent=cart.size+' çeşit · '+s.tq+' adet'+(s.hp?' · '+money(s.tt)+' ₺':'');
  $('#dClose').showModal();
};
$('#gMail').onclick=()=>{if(!cfg.email){alert('Ayarlardan e-posta gir');return}
  const s=summary();location.href='mailto:'+encodeURIComponent(cfg.email)+'?subject='+encodeURIComponent(s.subject)+'&body='+encodeURIComponent(s.body)};
$('#gWa').onclick=()=>{let p=cfg.phone;if(!p){alert('Ayarlardan WhatsApp numarası gir');return}
  if(p.startsWith('0'))p='90'+p.slice(1);else if(p.length===10&&p[0]==='5')p='90'+p;
  window.open('https://wa.me/'+p+'?text='+encodeURIComponent(summary().body),'_blank')};
$('#gXls').onclick=async()=>{
  const aoa=[['Barkod','Ürün','Adet','Fiyat','Tutar'],...items().map(x=>[x.code,x.name,x.qty,x.price,x.total])];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Hesap');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  const name='hesap_'+new Date().toISOString().slice(0,16).replace(/[-:T]/g,'')+'.xlsx';
  const file=new File([buf],name,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Hesap'});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
};
$('#gNew').onclick=()=>{if(confirm('Sepet temizlensin mi?')){cart.clear();render();saveCart();$('#dClose').close()}};
$('#gBack').onclick=()=>$('#dClose').close();

/* ---------- Başlangıç ---------- */
(async()=>{
  const c=await kvGet('catalog');if(c&&c.length)setCatalog(c);
  const k=await kvGet('cart');if(k)cart=new Map(k);
  render();
  try{const m={name:'Barkod Terminal',short_name:'Barkod',start_url:location.href,display:'standalone',background_color:'#111111',theme_color:'#111111',
    icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#16a34a"/><path d="M20 25h6v50h-6zM32 25h3v50h-3zM40 25h8v50h-8zM54 25h3v50h-3zM62 25h6v50h-6zM74 25h4v50h-4z" fill="#fff"/></svg>'),sizes:'any',type:'image/svg+xml'}]};
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l)}catch(e){}
})();
</script>
</body>
</html>
